name: macOS checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  device-free:
    name: Build and device-free checks
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - name: Install native build and self-check dependencies
        run: brew install cmake pkgconf opus ffmpeg
      - name: Project and release-content checks
        run: |
          make check
          make check-release-content
          python3 -m unittest discover -s tests -p 'test_check_release.py'
      - name: Format first-party crates
        run: cargo fmt -p nxbridge-host -p nxbridge-media -p nxbridge-stream -p nxbridge-gamestream -- --check
      - name: Build and test locked workspace
        run: |
          cargo build --locked --workspace
          cargo test --locked --workspace
      - name: Clippy (existing warnings are reported)
        run: cargo clippy --locked --workspace --all-targets --no-deps
      - name: Local synthetic media
        run: make check-synthetic
      - name: Native media regressions
        run: make check-native-media
      - name: Timestamped audio bridge, Opus and FEC
        run: make check-audio-bridge
      - name: Video FEC compatibility and bounded handoff
        run: make check-video-bridge
