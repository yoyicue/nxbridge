[package]
name = "nxbridge-gamestream"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-only"

[dependencies]
moonshine-core = { path = "../../vendor/moonshine-core" }
nxbridge-media = { path = "../nxbridge-media" }
nxbridge-stream = { path = "../nxbridge-stream" }
async-shutdown = "0.2.2"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "time", "process", "io-util", "sync", "signal", "net"] }
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
